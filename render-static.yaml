# Standalone Blueprint: creates only the static frontend, never API or database.
# First validate it in a separate Render Blueprint using this file's path.
services:
  - type: web
    name: football-training-board-static
    runtime: static
    branch: main
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:web
    staticPublishPath: artifacts/football-training-board/dist/public
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://football-training-board-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
