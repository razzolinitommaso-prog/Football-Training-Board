name: Prelaunch finance and responsive
on:
  pull_request:
    paths: ['artifacts/football-training-board/**','artifacts/api-server/src/lib/club-backup.ts','artifacts/api-server/src/lib/club-data-audit.ts','artifacts/api-server/src/routes/club-backup.ts','artifacts/api-server/src/routes/players.ts','lib/**','scripts/prelaunch/**','scripts/*backup*.cjs','scripts/test-financial-*.cjs','scripts/test-kit-potential-detail.cjs','scripts/test-warehouse-finance.cjs','scripts/test-school-lnd.cjs','scripts/test-parent-late-availability.cjs','artifacts/api-server/src/routes/parent.ts','artifacts/api-server/src/routes/championships.ts','artifacts/api-server/src/routes/warehouse-finance.ts','artifacts/api-server/src/lib/warehouse-finance.ts','artifacts/api-server/src/routes/matches.ts','scripts/test-match-rotation-access.cjs','playwright.prelaunch.config.ts','pnpm-lock.yaml','.github/workflows/prelaunch.yml']
  push:
    branches: [main]
    paths: ['artifacts/football-training-board/**','artifacts/api-server/src/lib/club-backup.ts','artifacts/api-server/src/lib/club-data-audit.ts','artifacts/api-server/src/routes/club-backup.ts','artifacts/api-server/src/routes/players.ts','lib/**','scripts/prelaunch/**','scripts/*backup*.cjs','scripts/test-financial-*.cjs','scripts/test-kit-potential-detail.cjs','scripts/test-warehouse-finance.cjs','scripts/test-school-lnd.cjs','scripts/test-parent-late-availability.cjs','artifacts/api-server/src/routes/parent.ts','artifacts/api-server/src/routes/championships.ts','artifacts/api-server/src/routes/warehouse-finance.ts','artifacts/api-server/src/lib/warehouse-finance.ts','artifacts/api-server/src/routes/matches.ts','scripts/test-match-rotation-access.cjs','playwright.prelaunch.config.ts','pnpm-lock.yaml','.github/workflows/prelaunch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: verify-${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:finance
      - run: node scripts/test-club-backup.cjs
      - run: node scripts/test-match-rotation-access.cjs @electric-sql/pglite --withdrawals
        if: matrix.browser == 'chromium'
      - run: node scripts/test-match-rotation-access.cjs @electric-sql/pglite --school-lnd
      - run: node scripts/test-match-rotation-access.cjs @electric-sql/pglite --report-scores
      - run: node scripts/test-match-rotation-access.cjs @electric-sql/pglite --late-availability
        if: matrix.browser == 'chromium'
      - run: pnpm run build:web
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run test:prelaunch --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prelaunch-report-${{ matrix.browser }}
          path: .tools/prelaunch-report
          retention-days: 14
